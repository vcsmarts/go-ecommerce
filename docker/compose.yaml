services:
  postgres:
    image: postgres:18.6-trixie
    container_name: shop-postgres
    environment:
      POSTGRES_DB: goecommerce
      POSTGRES_USER: goecommerce
      POSTGRES_PASSWORD: goecommerce
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U goecommerce -d goecommerce"]
      interval: 5s
      timeout: 3s
      retries: 10

  localstack:
    image: localstack/localstack:2026.10.4
    container_name: shop-localstack
    environment:
      SERVICES: s3,sqs
      AWS_DEFAULT_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
    ports:
      - "4566:4566" # LocalStack gateway (all services)
    volumes:
      - ./localstack-init:/etc/localstack/init/ready.d:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -sf localhost:4566/_localstack/health | grep -q '\"s3\": \"available\"'"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  postgres_data: